# Horarios de las funciones programadas del check-in diario.
# (El cron declarado dentro del .js con exports.config no lo reconoce Netlify.)
[functions."schedule-checkin"]
  schedule = "5 0 * * *"

[functions."checkin-notifier"]
  schedule = "*/10 * * * *"

# Aviso de los días que toca "Juntos" (1–2 por semana). Se comprueba cada 30 min
# y avisa una sola vez, a partir de las 18:00 de Madrid.
[functions."juntos-notifier"]
  schedule = "*/30 * * * *"
