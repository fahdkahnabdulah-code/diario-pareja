# Horarios de las funciones programadas del check-in diario.
# (El cron declarado dentro del .js con exports.config no lo reconoce Netlify.)
[functions."schedule-checkin"]
  schedule = "5 0 * * *"

[functions."checkin-notifier"]
  schedule = "*/10 * * * *"

# Aviso de los días que toca "Juntos" (1–2 por semana). Se comprueba cada 30 min
# y avisa una sola vez, a partir de las 18:00 de Madrid.
[functions."juntos-notifier"]
  schedule = "*/30 * * * *"

# Avisos de fechas importantes y eventos (7 días, 3 días, el día anterior y el mismo día).
# Se comprueba cada 30 min y avisa una sola vez cada uno, a partir de las 09:00 de Madrid.
[functions."eventos-notifier"]
  schedule = "*/30 * * * *"

# Llave de deseos: lunes (llave nueva) y sábado (recordatorio). Cada 30 min, avisa una sola vez.
[functions."deseos-notifier"]
  schedule = "*/30 * * * *"

# Dopi: avisos de "te echa de menos", vidas y despedida. Cada 30 min, solo envía de 09:00 a 22:00 (Madrid).
[functions."pet-notifier"]
  schedule = "*/30 * * * *"
